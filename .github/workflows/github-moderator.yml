name: GitHub Moderator

# GMV GitHub Moderator V1
# Default mode is AUDIT. APPLY requires the GitHub Environment
# `github-moderator-apply` with required reviewers plus the repository variable
# GMV_MODERATOR_APPLY_GATE=enabled. A workflow input alone is not approval.
#
# Trust boundary (P0):
# - pull_request runs never receive GitHub App secrets, including same-repo PRs.
# - Privilege is decided from github.event_name in the workflow expression itself
#   (not from checked-out PR Python, which an attacker could rewrite).
# - App credentials must live as Environment secrets on
#   `github-moderator-privileged` and `github-moderator-apply` (not repository
#   secrets) with a deployment branch policy limited to main.
# - Configuration validation and unit tests never require privileged credentials.
# - pull_request_target is intentionally not used.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Operating mode"
        required: true
        type: choice
        options:
          - AUDIT
          - DRY_RUN
          - APPLY
        default: AUDIT
  pull_request:
    paths:
      - "config/github/**"
      - ".github/workflows/github-moderator.yml"
      - "scripts/github_moderator_*.py"
      - "tests/test_github_moderator*.py"
      - "docs/github-moderator*.md"
  push:
    branches:
      - main
    paths:
      - "config/github/**"
      - ".github/workflows/github-moderator.yml"
      - "scripts/github_moderator_*.py"
      - "tests/test_github_moderator*.py"
      - "docs/github-moderator*.md"
  schedule:
    # Weekly audit on Mondays 06:00 UTC
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  # Prefer github.event.inputs so non-dispatch events do not touch the
  # workflow_dispatch-only inputs context.
  group: github-moderator-${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.mode || 'AUDIT' }}
  cancel-in-progress: false

jobs:
  resolve-mode:
    name: Resolve mode
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      privileged: ${{ steps.resolve.outputs.privileged }}
    steps:
      - name: Resolve
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          # Informational only — never used to grant privilege.
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          mode="${INPUT_MODE:-AUDIT}"
          if [ "${EVENT_NAME}" != "workflow_dispatch" ]; then
            mode="AUDIT"
          fi
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"

          # Privilege is derived only from the Actions event name.
          # Same-repository pull requests are NOT trusted.
          # Do not call checked-out Python here — PR code could rewrite it.
          privileged=false
          case "${EVENT_NAME}" in
            workflow_dispatch|schedule|push)
              privileged=true
              ;;
            pull_request|pull_request_target)
              privileged=false
              ;;
            *)
              privileged=false
              ;;
          esac
          echo "privileged=${privileged}" >> "${GITHUB_OUTPUT}"
          echo "Resolved mode=${mode} privileged=${privileged}"
          echo "head_repo=${HEAD_REPO:-none} repository=${REPOSITORY}"
          if [ "${privileged}" != "true" ]; then
            echo "BLOCKED for privileged credentials on this event path."
          fi

  validate:
    name: Validate configuration
    runs-on: ubuntu-latest
    needs: resolve-mode
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --upgrade pip && python -m pip install 'pyyaml>=6'

      - name: Validate moderator config (no privileged credentials)
        run: python3 scripts/github_moderator_validate.py

      - name: Workflow security invariants (no privileged credentials)
        run: python3 scripts/github_moderator_security.py check-workflow

      - name: Unit and negative security tests (no privileged credentials)
        run: |
          python -m pip install pytest
          pytest tests/test_github_moderator_validate.py \
            tests/test_github_moderator_audit.py \
            tests/test_github_moderator_security.py -q

      - name: Document PR trust boundary
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -eu
          {
            echo "## GitHub Moderator PR path"
            echo
            echo "- Event: \`pull_request\`"
            echo "- Privileged credentials: **not available**"
            echo "- Same-repository PRs are not auto-trusted"
            echo "- Jobs run: configuration validation + unit/security tests only"
            echo "- Live AUDIT / DRY_RUN / APPLY with App tokens: skipped"
            echo "- Resolve privileged flag: \`${{ needs.resolve-mode.outputs.privileged }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  audit:
    name: Audit desired vs actual
    runs-on: ubuntu-latest
    needs: [resolve-mode, validate]
    # YAML-native event gate: never on pull_request, even if a PR rewrites
    # helper scripts. Environment secrets further restrict credential access.
    if: ${{ github.event_name != 'pull_request' && needs.resolve-mode.outputs.privileged == 'true' && (needs.resolve-mode.outputs.mode == 'AUDIT' || needs.resolve-mode.outputs.mode == 'DRY_RUN' || needs.resolve-mode.outputs.mode == 'APPLY') }}
    environment: github-moderator-privileged
    permissions:
      contents: read
      # Ruleset reads need the GitHub App (Administration). GITHUB_TOKEN has no
      # administration permission scope; fallback audit may return BLOCKED/403.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --upgrade pip && python -m pip install 'pyyaml>=6'

      - name: Re-verify privileged path policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          python3 scripts/github_moderator_security.py check-trust \
            --event "${EVENT_NAME}" \
            --repository "${REPOSITORY}" \
            --ref "${REF}"

      - name: Generate GitHub App token (optional)
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GMV_GITHUB_MODERATOR_APP_CLIENT_ID }}
          private-key: ${{ secrets.GMV_GITHUB_MODERATOR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: gmv-foundation

      - name: Choose token source
        id: token-source
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -eu
          # Never write the token value to GITHUB_OUTPUT, logs, or summaries.
          if [ -n "${APP_TOKEN}" ]; then
            echo "source=github-app" >> "${GITHUB_OUTPUT}"
          else
            echo "source=github-token" >> "${GITHUB_OUTPUT}"
            echo "::warning::GitHub App credentials missing or unusable; falling back to GITHUB_TOKEN for read-only audit."
          fi

      - name: Run audit
        env:
          # Token stays in env only for this step. Not published as a job output.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          TOKEN_SOURCE: ${{ steps.token-source.outputs.source }}
        run: |
          set -eu
          mkdir -p artifacts
          python3 scripts/github_moderator_audit.py \
            --repo "${{ github.repository }}" \
            --report artifacts/github-moderator-audit.json
          {
            echo "## GitHub Moderator audit"
            echo
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Mode request: \`${{ needs.resolve-mode.outputs.mode }}\`"
            echo "- Token source: \`${TOKEN_SOURCE}\`"
            echo "- Repository: \`${{ github.repository }}\`"
            echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo '```json'
            cat artifacts/github-moderator-audit.json
            echo
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload audit report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-moderator-audit
          path: artifacts/github-moderator-audit.json
          if-no-files-found: error

  dry-run:
    name: Dry run sync preview
    runs-on: ubuntu-latest
    needs: [resolve-mode, validate, audit]
    if: ${{ github.event_name != 'pull_request' && needs.resolve-mode.outputs.mode == 'DRY_RUN' && needs.resolve-mode.outputs.privileged == 'true' && github.event_name == 'workflow_dispatch' }}
    environment: github-moderator-privileged
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --upgrade pip && python -m pip install 'pyyaml>=6'

      - name: Re-verify privileged path policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          python3 scripts/github_moderator_security.py check-trust \
            --event "${EVENT_NAME}" \
            --repository "${REPOSITORY}" \
            --ref "${REF}"

      - name: Require GitHub App credentials
        env:
          CLIENT_ID: ${{ vars.GMV_GITHUB_MODERATOR_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.GMV_GITHUB_MODERATOR_APP_PRIVATE_KEY }}
        run: |
          set -eu
          if [ -z "${CLIENT_ID}" ] || [ -z "${PRIVATE_KEY}" ]; then
            echo "BLOCKED: DRY_RUN requires the GitHub App identity."
            echo "Set Environment secrets on github-moderator-privileged"
            echo "(not repository secrets) for GMV_GITHUB_MODERATOR_APP_PRIVATE_KEY"
            echo "and variable GMV_GITHUB_MODERATOR_APP_CLIENT_ID."
            echo "Do not use a personal access token."
            exit 1
          fi

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GMV_GITHUB_MODERATOR_APP_CLIENT_ID }}
          private-key: ${{ secrets.GMV_GITHUB_MODERATOR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: gmv-foundation

      - name: Preview settings and ruleset sync
        id: sync
        uses: joshjohanning/bulk-github-repo-settings-sync-action@40134e844f292d0dcdc88c24fde06f085d191a35 # v2.12.4
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          repositories-file: config/github/settings-config.yml
          delete-unmanaged-rulesets: false
          dry-run: true
          write-job-summary: true
          summary-heading: "GMV GitHub Moderator DRY_RUN"

      - name: Record dry-run outputs
        env:
          CHANGED: ${{ steps.sync.outputs.changed-repositories }}
          FAILED: ${{ steps.sync.outputs.failed-repositories }}
          RESULTS: ${{ steps.sync.outputs.results }}
        run: |
          set -eu
          mkdir -p artifacts
          printf '%s\n' "${RESULTS}" > artifacts/github-moderator-dry-run-results.json
          {
            echo "## Dry-run summary"
            echo
            echo "- Trigger: workflow_dispatch"
            echo "- Target allowlist: tiktokagentur-art/gmv-foundation only"
            echo "- changed-repositories: ${CHANGED}"
            echo "- failed-repositories: ${FAILED}"
            echo "- Writes performed: none (dry-run=true)"
            echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ "${FAILED}" != "0" ] && [ -n "${FAILED}" ]; then
            echo "Dry-run reported failed repositories: ${FAILED}"
            exit 1
          fi

      - name: Upload dry-run results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-moderator-dry-run
          path: artifacts/github-moderator-dry-run-results.json

  apply:
    name: Apply approved sync
    runs-on: ubuntu-latest
    needs: [resolve-mode, validate, audit]
    if: ${{ github.event_name != 'pull_request' && needs.resolve-mode.outputs.mode == 'APPLY' && needs.resolve-mode.outputs.privileged == 'true' && github.event_name == 'workflow_dispatch' }}
    # Server-enforced approval. Creating this environment without required
    # reviewers is incomplete; the gate variable must also be enabled by CEO.
    environment: github-moderator-apply
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --upgrade pip && python -m pip install 'pyyaml>=6'

      - name: Enforce APPLY gate (main + CEO gate + environment)
        env:
          REF: ${{ github.ref }}
          GATE: ${{ vars.GMV_MODERATOR_APPLY_GATE }}
          EVENT_NAME: ${{ github.event_name }}
          MODE: ${{ needs.resolve-mode.outputs.mode }}
          REPOSITORY: ${{ github.repository }}
          # Reaching this step means GitHub already enforced environment
          # reviewers for github-moderator-apply on this workflow_dispatch run.
          ENVIRONMENT_APPROVED: "true"
        run: |
          set -eu
          # Defense in depth: enforce main in the workflow before the policy module.
          if [ "${REF}" != "refs/heads/main" ]; then
            echo "BLOCKED: APPLY is only allowed from refs/heads/main (got ${REF})."
            echo "Merge the moderator PR first. No bypass."
            exit 1
          fi
          if [ "${GATE}" != "enabled" ]; then
            echo "BLOCKED: repository variable GMV_MODERATOR_APPLY_GATE is not 'enabled'."
            echo "CEO must enable the gate after the Environment has required reviewers."
            echo "A workflow input is not approval."
            exit 1
          fi
          set +e
          python3 scripts/github_moderator_security.py check-apply \
            --event "${EVENT_NAME}" \
            --mode "${MODE}" \
            --ref "${REF}" \
            --gate "${GATE}" \
            --environment-name github-moderator-apply \
            --environment-approved "${ENVIRONMENT_APPROVED}" \
            --has-app-credentials true \
            --repository "${REPOSITORY}"
          rc=$?
          set -e
          if [ "${rc}" -ne 0 ]; then
            echo "BLOCKED: APPLY prerequisites not met."
            exit 1
          fi

      - name: Require GitHub App credentials
        env:
          CLIENT_ID: ${{ vars.GMV_GITHUB_MODERATOR_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.GMV_GITHUB_MODERATOR_APP_PRIVATE_KEY }}
        run: |
          set -eu
          if [ -z "${CLIENT_ID}" ] || [ -z "${PRIVATE_KEY}" ]; then
            echo "BLOCKED: APPLY requires the GitHub App identity."
            echo "Personal tokens are not permitted."
            echo "Store App credentials as Environment secrets on"
            echo "github-moderator-apply (not repository secrets)."
            exit 1
          fi

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GMV_GITHUB_MODERATOR_APP_CLIENT_ID }}
          private-key: ${{ secrets.GMV_GITHUB_MODERATOR_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: gmv-foundation

      - name: Pre-apply audit snapshot
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -eu
          mkdir -p artifacts
          python3 scripts/github_moderator_audit.py \
            --repo "${{ github.repository }}" \
            --report artifacts/github-moderator-before.json

      - name: Apply settings and ruleset sync
        id: sync
        uses: joshjohanning/bulk-github-repo-settings-sync-action@40134e844f292d0dcdc88c24fde06f085d191a35 # v2.12.4
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          repositories-file: config/github/settings-config.yml
          delete-unmanaged-rulesets: false
          dry-run: false
          write-job-summary: true
          summary-heading: "GMV GitHub Moderator APPLY"

      - name: Post-apply readback
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CHANGED: ${{ steps.sync.outputs.changed-repositories }}
          FAILED: ${{ steps.sync.outputs.failed-repositories }}
        run: |
          set -eu
          python3 scripts/github_moderator_audit.py \
            --repo "${{ github.repository }}" \
            --report artifacts/github-moderator-after.json \
            --expect-aligned
          {
            echo "## APPLY documentation"
            echo
            echo "- Trigger: workflow_dispatch / APPLY"
            echo "- Actor: \`${{ github.actor }}\`"
            echo "- Target repository: \`${{ github.repository }}\`"
            echo "- Environment: \`github-moderator-apply\`"
            echo "- changed-repositories: ${CHANGED}"
            echo "- failed-repositories: ${FAILED}"
            echo "- Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "### Before"
            echo
            echo '```json'
            cat artifacts/github-moderator-before.json
            echo
            echo '```'
            echo
            echo "### After"
            echo
            echo '```json'
            cat artifacts/github-moderator-after.json
            echo
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload before/after reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-moderator-apply
          path: |
            artifacts/github-moderator-before.json
            artifacts/github-moderator-after.json
