name: PR triage (advisory)

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

# Metadata review only: no checkout of untrusted PR code, no write permissions.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-triage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  triage:
    name: PR triage (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect PR metadata and changed filenames
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          pr = event["pull_request"]
          number = int(pr["number"])
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          if not token:
              raise SystemExit("Missing read-only GitHub token")

          filenames = []
          for page in range(1, 31):
              url = f"https://api.github.com/repos/{repo}/pulls/{number}/files?per_page=100&page={page}"
              req = Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urlopen(req, timeout=15) as response:
                  payload = json.load(response)
              if not isinstance(payload, list):
                  raise SystemExit("Unexpected GitHub file-list response")
              for item in payload:
                  if not isinstance(item, dict) or not isinstance(item.get("filename"), str):
                      raise SystemExit("Unexpected changed-file entry")
                  filenames.append(item["filename"].replace("\r", " ").replace("\n", " "))
              if len(payload) < 100:
                  break

          critical_exact = {
              ".github/CODEOWNERS",
              "SECURITY.md",
              "Dockerfile",
              "docs/GOVERNANCE.md",
              "scripts/gitleaks_scan.py",
          }
          sensitive = sorted(
              path for path in filenames
              if path.startswith((".github/workflows/", "docs/adr/", "app/credentials"))
              or path in critical_exact
              or path.endswith((".env", ".pem", ".key"))
          )
          md = [
              "## GITHUB-AUTO-001 · PR triage (advisory)",
              "",
              f"- PR: #{number}; draft: {bool(pr.get('draft'))}",
              f"- Changed files inspected: {len(filenames)}",
              "- Existing required CI checks remain: Lint and structure, Backend, Image.",
              "- No approval, merge, comment, code modification, secret access or deployment was performed.",
              "- AI review and automated fixes are **not enabled** (separate provider, security and cost gates).",
          ]
          if not str(pr.get("body") or "").strip():
              md.append("- PR description is empty: author should add scope, tests and risks.")
          if sensitive:
              md.extend(["", "### Security-sensitive paths – independent review needed"])
              md.extend(f"- `{path.replace(chr(96), chr(39))}`" for path in sensitive[:30])
              if len(sensitive) > 30:
                  md.append(f"- … and {len(sensitive) - 30} further paths.")
              print("::warning title=PR review needed::Security-sensitive files changed; independent review required.")
          else:
              md.extend(["", "No pre-classified security-sensitive paths were found. This is not a security approval."])
          if len(filenames) == 3000:
              md.append("- WARNING: GitHub limits changed-file listings to 3000 files; manual completeness check required.")
              print("::warning title=PR file limit::Changed-file listing reached GitHub's 3000-file limit.")
          summary = "\n".join(md) + "\n"
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as output:
              output.write(summary)
          print("Read-only PR triage completed. No merge or approval performed.")
          PY
