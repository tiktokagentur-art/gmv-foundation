[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gmv-foundation"
version = "0.1.0"
description = "GMV Foundation service skeleton"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "fastapi>=0.115",
  "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0.36",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.0",
  "openapi-spec-validator>=0.7",
  "pytest>=8.3",
  "pyyaml>=6",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
